<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Card Points Tracker</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;background:#0d0f18;color:#e2e8f0}#root{height:100vh;display:flex;flex-direction:column}.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}/* Header */.header{background:linear-gradient(135deg,#1a1d2e 0%,#16213e 100%);padding:14px 18px 10px;border-bottom:1px solid #2d3561;display:flex;align-items:center;gap:12px;flex-shrink:0}.header-logo{font-size:26px}.header-title{font-size:19px;font-weight:700;color:#a78bfa;letter-spacing:-0.3px}.header-sub{font-size:11px;color:#64748b;margin-top:1px}/* Tab content */.tab-content{flex:1;overflow-y:auto;padding:14px 14px 8px}/* Bottom nav */.bottom-nav{display:flex;background:#1a1d2e;border-top:1px solid #2d3561;padding:6px 0 8px;flex-shrink:0}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;cursor:pointer;border:none;background:none;color:#64748b;font-size:10px;font-weight:500;letter-spacing:0.3px;transition:color .2s;-webkit-tap-highlight-color:transparent}.nav-item.active{color:#a78bfa}.nav-icon{font-size:20px;line-height:1}/* Cards */.card{background:#1a1d2e;border:1px solid #2d3561;border-radius:14px;padding:14px;margin-bottom:10px}.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.card-title{font-size:14px;font-weight:600;color:#c4b5fd}.section-title{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}/* Buttons */.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .18s;line-height:1;-webkit-tap-highlight-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:white}.btn-primary:not(:disabled):hover{filter:brightness(1.12)}.btn-secondary{background:#2d3561;color:#c4b5fd}.btn-secondary:hover{background:#3d4571}.btn-danger{background:#7f1d1d;color:#fca5a5}.btn-success{background:#064e3b;color:#6ee7b7}.btn-sm{padding:5px 9px;font-size:11px;border-radius:7px}.btn-icon{padding:6px;border-radius:8px}.btn-full{width:100%}.btn-ghost{background:transparent;color:#94a3b8}.btn-ghost:hover{background:#1e2235;color:#e2e8f0}/* Forms */.form-group{margin-bottom:13px}.form-label{display:block;font-size:11px;font-weight:500;color:#94a3b8;margin-bottom:5px;letter-spacing:.3px}.form-input{width:100%;padding:9px 11px;background:#0d0f18;border:1px solid #2d3561;border-radius:9px;color:#e2e8f0;font-size:13px;outline:none;transition:border-color .18s}.form-input:focus{border-color:#7c3aed}.form-input::placeholder{color:#475569}/* Player chip */.player-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:500;background:#2d3561;border:1px solid #3d4571}.player-avatar{font-size:16px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}/* Modals */.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:1000}.modal{background:#1a1d2e;border:1px solid #2d3561;border-radius:20px 20px 0 0;padding:22px 18px 28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:slideUp .22s ease}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}.modal-title{font-size:17px;font-weight:700;color:#c4b5fd;margin-bottom:18px}/* List items */.list-item{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#0d0f18;border-radius:11px;margin-bottom:7px;border:1px solid #1e2235}/* Badges */.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:600}.badge-gold{background:#78350f;color:#fde68a}.badge-silver{background:#334155;color:#cbd5e1}.badge-bronze{background:#431407;color:#fdba74}.badge-4th{background:#1e3a5f;color:#93c5fd}.badge-penalty{background:#7f1d1d;color:#fca5a5}.badge-bonus{background:#064e3b;color:#6ee7b7}/* Stats */.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat-box{background:#0d0f18;border:1px solid #1e2235;border-radius:12px;padding:13px;text-align:center}.stat-value{font-size:26px;font-weight:700;color:#a78bfa}.stat-label{font-size:10px;color:#64748b;margin-top:2px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}/* Toggle */.toggle-group{display:flex;background:#0d0f18;border-radius:9px;padding:3px;gap:3px}.toggle-option{flex:1;padding:7px;text-align:center;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;border:none;background:none;transition:all .18s}.toggle-option.active{background:#7c3aed;color:white}/* Emoji grid */.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.emoji-btn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:23px;border-radius:9px;cursor:pointer;border:2px solid transparent;background:#0d0f18;transition:all .13s}.emoji-btn.selected{border-color:#7c3aed;background:#2e1065}.emoji-btn:hover{background:#1e2235}/* Color picker */.color-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .13s}.color-dot.selected{border-color:white;transform:scale(1.22)}/* Leaderboard */.lb-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;margin-bottom:5px}.lb-rank{width:22px;text-align:center;font-weight:700;font-size:13px;color:#64748b}.lb-rank-1{color:#f59e0b}.lb-rank-2{color:#94a3b8}.lb-rank-3{color:#fb923c}.lb-score{margin-left:auto;font-weight:700;font-size:15px;color:#a78bfa}/* Checkbox */.checkbox-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;background:#0d0f18;border:1px solid #1e2235;margin-bottom:5px;transition:all .13s}.checkbox-item.checked{border-color:#7c3aed;background:#2e1065}.checkbox{width:17px;height:17px;border-radius:5px;border:2px solid #3d4571;display:flex;align-items:center;justify-content:center;flex-shrink:0}.checkbox.checked{background:#7c3aed;border-color:#7c3aed}/* Number stepper */.num-btn{width:30px;height:30px;border-radius:7px;background:#2d3561;border:none;color:#c4b5fd;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}.num-btn:disabled{opacity:.4;cursor:not-allowed}.num-val{font-size:15px;font-weight:600;min-width:28px;text-align:center}/* Progress bar */.progress-bar{height:5px;border-radius:3px;background:#1e2235;overflow:hidden;margin-top:5px}.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .5s}/* Hand row */.hand-row{padding:9px 11px;background:#0d0f18;border-radius:9px;margin-bottom:5px;border:1px solid #1e2235}.hand-num{font-size:10px;color:#64748b;font-weight:500;margin-bottom:5px}.hand-placements{display:flex;flex-wrap:wrap;gap:4px}/* Round status */.status-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#6ee7b7;font-weight:500}.status-dot-live{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}/* Misc */.divider{height:1px;background:#1e2235;margin:12px 0}.empty-state{text-align:center;padding:36px 20px;color:#475569}.empty-icon{font-size:44px;margin-bottom:10px}.empty-text{font-size:14px;font-weight:500;color:#64748b}.empty-sub{font-size:12px;margin-top:4px}.fade-in{animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2d3561;border-radius:2px}</style></head><body><div id="root"></div><script type="text/babel">const { useState, useEffect, useMemo } = React;const DEFAULT_SETTINGS = { points: { first: 10, second: 7, third: 5, fourth: 2, penalty: -5 } };const EMOJIS = ['🦁','🐯','🐻','🦊','🐼','🦅','🐲','🎭','🃏','♟️','🎯','⚡','🔥','❄️','🌊','👑','🥷','😎','🤠','🎪','🦋','🌸','🍀','⭐','💎','🏆','🎸','🚀','🌙','🦄'];const COLORS = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9','#FF9FF3','#54A0FF','#5F27CD','#01CBC6','#FF9F43'];const store = {  get: (k, d) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : d; } catch { return d; } },  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};let _id = Date.now();const uid = () => String(++_id);const fmtDate = ts => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });const calcScore = (pts, hands, pid) => {  let t = 0;  for (const h of hands) {    if (h.placements?.first === pid) t += pts.first;    if (h.placements?.second === pid) t += pts.second;    if (h.placements?.third === pid) t += pts.third;    if (h.placements?.fourth === pid) t += pts.fourth;    if ((h.burned || []).includes(pid)) t += pts.penalty;    for (const b of (h.bonuses || [])) if (b.participantId === pid) t += b.amount;  }  return t;};// ─── CheckItem ───────────────────────────────────────────────function CheckItem({ checked, onClick, children }) {  return (    <div className={`checkbox-item${checked ? ' checked' : ''}`} onClick={onClick}>      <div className={`checkbox${checked ? ' checked' : ''}`}>        {checked && <span style={{color:'white',fontSize:10}}>✓</span>}      </div>      <div style={{flex:1}}>{children}</div>    </div>  );}// ─── PlayerChip ───────────────────────────────────────────────function PlayerChip({ player }) {  if (!player) return null;  return (    <div className="player-chip" style={{borderColor:player.color+'44',background:player.color+'18'}}>      <div className="player-avatar" style={{background:player.color+'28'}}>{player.avatar}</div>      <span style={{color:player.color||'#e2e8f0'}}>{player.name}</span>    </div>  );}// ─── PlayerModal ──────────────────────────────────────────────function PlayerModal({ player, onSave, onClose }) {  const [name, setName] = useState(player?.name || '');  const [avatar, setAvatar] = useState(player?.avatar || EMOJIS[0]);  const [color, setColor] = useState(player?.color || COLORS[0]);  return (    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>      <div className="modal">        <div className="modal-title">{player ? 'Edit Player' : 'Add Player'}</div>        <div className="form-group">          <label className="form-label">Name</label>          <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder="Player name…" autoFocus />        </div>        <div className="form-group">          <label className="form-label">Avatar</label>          <div className="emoji-grid">            {EMOJIS.map(e => (              <button key={e} className={`emoji-btn${avatar===e?' selected':''}`} onClick={() => setAvatar(e)}>{e}</button>            ))}          </div>        </div>        <div className="form-group">          <label className="form-label">Color</label>          <div className="color-grid">            {COLORS.map(c => (              <div key={c} className={`color-dot${color===c?' selected':''}`} style={{background:c}} onClick={() => setColor(c)} />            ))}          </div>        </div>        <div style={{display:'flex',gap:8,marginTop:6}}>          <button className="btn btn-secondary btn-full" onClick={onClose}>Cancel</button>          <button className="btn btn-primary btn-full" onClick={() => name.trim() && onSave({name:name.trim(),avatar,color})} disabled={!name.trim()}>            {player ? 'Save Changes' : 'Add Player'}          </button>        </div>      </div>    </div>  );}// ─── NewRoundModal ────────────────────────────────────────────function NewRoundModal({ players, onSave, onClose }) {  const [name, setName] = useState(`Round ${new Date().toLocaleDateString()}`);  const [type, setType] = useState('single');  const [selectedPlayers, setSelectedPlayers] = useState(() => players.map(p => p.id));  const [teams, setTeams] = useState([    { id: uid(), name: 'Team A', playerIds: [] },    { id: uid(), name: 'Team B', playerIds: [] }  ]);  const togglePlayer = id => setSelectedPlayers(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);  const addTeam = () => setTeams(p => [...p, { id: uid(), name: `Team ${String.fromCharCode(65+p.length)}`, playerIds: [] }]);  const removeTeam = id => setTeams(p => p.filter(t => t.id !== id));  const toggleTeamPlayer = (teamId, playerId) => {    setTeams(prev => {      const inTeam = prev.find(t => t.id === teamId)?.playerIds.includes(playerId);      const cleared = prev.map(t => ({ ...t, playerIds: t.playerIds.filter(p => p !== playerId) }));      return cleared.map(t => t.id === teamId        ? { ...t, playerIds: inTeam ? t.playerIds : [...t.playerIds, playerId] }        : t      );    });  };  const canSave = type === 'single'    ? selectedPlayers.length >= 2    : teams.filter(t => t.playerIds.length > 0).length >= 2;  return (    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>      <div className="modal">        <div className="modal-title">New Round</div>        <div className="form-group">          <label className="form-label">Round Name</label>          <input className="form-input" value={name} onChange={e => setName(e.target.value)} />        </div>        <div className="form-group">          <label className="form-label">Type</label>          <div className="toggle-group">            <button className={`toggle-option${type==='single'?' active':''}`} onClick={() => setType('single')}>👤 Individual</button>            <button className={`toggle-option${type==='team'?' active':''}`} onClick={() => setType('team')}>👥 Team</button>          </div>        </div>        {type === 'single' && (          <div className="form-group">            <label className="form-label">Players (select ≥ 2)</label>            {players.length === 0              ? <p style={{color:'#64748b',fontSize:12,padding:'8px 0'}}>No players yet — add some in Settings first.</p>              : players.map(p => (                <CheckItem key={p.id} checked={selectedPlayers.includes(p.id)} onClick={() => togglePlayer(p.id)}>                  <PlayerChip player={p} />                </CheckItem>              ))            }          </div>        )}        {type === 'team' && (          <div className="form-group">            <label className="form-label">Teams</label>            {teams.map(team => (              <div key={team.id} className="card" style={{marginBottom:8,padding:11}}>                <div style={{display:'flex',gap:7,alignItems:'center',marginBottom:9}}>                  <input className="form-input" value={team.name} style={{flex:1}}                    onChange={e => setTeams(p => p.map(t => t.id===team.id ? {...t,name:e.target.value} : t))} />                  {teams.length > 2 && (                    <button className="btn btn-icon btn-danger btn-sm" onClick={() => removeTeam(team.id)}>✕</button>                  )}                </div>                {players.map(p => (                  <CheckItem key={p.id} checked={team.playerIds.includes(p.id)}                    onClick={() => toggleTeamPlayer(team.id, p.id)}>                    <PlayerChip player={p} />                  </CheckItem>                ))}                {players.length === 0 && <p style={{color:'#64748b',fontSize:12}}>Add players in Settings first.</p>}              </div>            ))}            <button className="btn btn-secondary btn-sm" onClick={addTeam}>+ Add Team</button>          </div>        )}        <div style={{display:'flex',gap:8,marginTop:8}}>          <button className="btn btn-secondary btn-full" onClick={onClose}>Cancel</button>          <button className="btn btn-primary btn-full" disabled={!canSave} onClick={() => {            onSave({              id: uid(),              name: name.trim() || 'Round',              type,              participants: type === 'single'                ? selectedPlayers.map(id => ({ id, type: 'player' }))                : teams.filter(t => t.playerIds.length > 0).map(t => ({ id: t.id, type: 'team', name: t.name, playerIds: t.playerIds })),              hands: [],              status: 'active',              createdAt: Date.now()            });          }}>Start Round</button>        </div>      </div>    </div>  );}// ─── AddHandModal ─────────────────────────────────────────────function AddHandModal({ round, players, pts, onSave, onClose }) {  const [rows, setRows] = useState({    first:  { participantId: '', bonus: '' },    second: { participantId: '', bonus: '' },    third:  { participantId: '', bonus: '' },    fourth: { participantId: '', bonus: '' },  });  const [burned, setBurned] = useState([]);  // Always list individual players; for team rounds attach teamName for display  const participants = round.type === 'single'    ? (round.participants || []).map(p => {        const player = players.find(pl => pl.id === p.id);        return { id: p.id, label: player?.name || '?', player };      })    : (round.participants || []).flatMap(t =>        (t.playerIds || []).map(pid => {          const player = players.find(pl => pl.id === pid);          return { id: pid, label: player?.name || '?', player, teamName: t.name };        })      );  const setRow = (slot, field, value) => setRows(prev => ({ ...prev, [slot]: { ...prev[slot], [field]: value } }));  // When a player is chosen for a placement slot, remove them from burned and other slots  const selectPlayer = (slot, val) => {    if (val) setBurned(prev => prev.filter(id => id !== val));    setRows(prev => {      const cleared = Object.fromEntries(        Object.entries(prev).map(([k, r]) => [k, k !== slot && r.participantId === val ? { ...r, participantId: '' } : r])      );      return { ...cleared, [slot]: { ...cleared[slot], participantId: val } };    });  };  // When a player is toggled in Burned, remove them from any placement slot  const toggleBurned = (pid) => {    const inBurned = burned.includes(pid);    if (!inBurned) {      // remove from placement slots      setRows(prev => Object.fromEntries(        Object.entries(prev).map(([k, r]) => [k, r.participantId === pid ? { ...r, participantId: '' } : r])      ));    }    setBurned(prev => inBurned ? prev.filter(id => id !== pid) : [...prev, pid]);  };  const slots = [    { key: 'first',  emoji: '🥇', label: '1st', pts: pts.first,  ptCol: '#f59e0b' },    { key: 'second', emoji: '🥈', label: '2nd', pts: pts.second, ptCol: '#94a3b8' },    { key: 'third',  emoji: '🥉', label: '3rd', pts: pts.third,  ptCol: '#fb923c' },    { key: 'fourth', emoji: '4️⃣', label: '4th', pts: pts.fourth, ptCol: '#818cf8' },  ];  // Union of all assigned IDs (slot placements + burned), deduplicated  const assignedSet = new Set([    ...Object.values(rows).map(r => r.participantId).filter(Boolean),    ...burned,  ]);  const totalAssigned = assignedSet.size;  const required = participants.length;  // Enabled when every participant has been placed somewhere  const canSave = required > 0 && totalAssigned === required;  return (    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>      <div className="modal">        <div className="modal-title">Hand #{round.hands.length + 1}</div>        {/* Column headers */}        <div style={{display:'grid',gridTemplateColumns:'76px 1fr 62px',gap:6,marginBottom:6,paddingLeft:2}}>          <div style={{fontSize:10,color:'#64748b',fontWeight:600,textTransform:'uppercase',letterSpacing:.5}}>Position</div>          <div style={{fontSize:10,color:'#64748b',fontWeight:600,textTransform:'uppercase',letterSpacing:.5}}>Player</div>          <div style={{fontSize:10,color:'#10b981',fontWeight:600,textTransform:'uppercase',letterSpacing:.5,textAlign:'center'}}>🎁 Bonus</div>        </div>        {slots.map(s => {          const row = rows[s.key];          return (            <div key={s.key} style={{display:'grid',gridTemplateColumns:'76px 1fr 62px',gap:6,alignItems:'center',marginBottom:7}}>              {/* Position label */}              <div style={{background:'#0d0f18',border:'1px solid #1e2235',borderRadius:8,padding:'7px 6px',display:'flex',alignItems:'center',gap:4}}>                <span style={{fontSize:15,lineHeight:1}}>{s.emoji}</span>                <div>                  <div style={{fontSize:11,fontWeight:600,color:s.ptCol}}>{s.label}</div>                  <div style={{fontSize:9,color:'#64748b'}}>+{s.pts}pt</div>                </div>              </div>              {/* Player dropdown */}              <select                className="form-input"                style={{padding:'8px 7px',fontSize:12}}                value={row.participantId}                onChange={e => selectPlayer(s.key, e.target.value)}              >                <option value="">— Select —</option>                {participants.map(p => (                  <option key={p.id} value={p.id}                    disabled={(assignedSet.has(p.id) && row.participantId !== p.id) || burned.includes(p.id)}>                    {p.label}{p.teamName ? ` (${p.teamName})` : ''}                  </option>                ))}              </select>              {/* Bonus */}              <input                type="number"                className="form-input"                style={{padding:'8px 6px',fontSize:12,textAlign:'center',border:'1px solid #064e3b',background:row.bonus?'#052e16':'#0d0f18',color:'#6ee7b7'}}                value={row.bonus}                placeholder="0"                onChange={e => setRow(s.key, 'bonus', e.target.value)}              />            </div>          );        })}        {/* Burned section */}        <div style={{background:'#110a0a',border:'1px solid #7f1d1d',borderRadius:10,padding:'10px 12px',marginTop:4,marginBottom:10}}>          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>            <span style={{fontSize:15}}>🔥</span>            <span style={{fontSize:12,fontWeight:600,color:'#fca5a5'}}>Burned</span>            <span style={{fontSize:10,color:'#64748b',marginLeft:2}}>{pts.penalty}pt each · select any</span>          </div>          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>            {participants.map(p => {              const isBurned = burned.includes(p.id);              const isInSlot = assignedSet.has(p.id) && !burned.includes(p.id);              return (                <div key={p.id}                  onClick={() => !isInSlot && toggleBurned(p.id)}                  style={{                    display:'flex',alignItems:'center',gap:5,                    padding:'5px 10px',borderRadius:999,cursor:isInSlot?'not-allowed':'pointer',                    background: isBurned ? '#7f1d1d' : '#1a0a0a',                    border: `1px solid ${isBurned ? '#ef4444' : '#3d1515'}`,                    opacity: isInSlot ? 0.35 : 1,                    transition:'all .15s'                  }}>                  <span style={{fontSize:15}}>{p.player?.avatar || '👥'}</span>                  <span style={{fontSize:12,fontWeight:500,color: isBurned ? '#fca5a5' : '#94a3b8'}}> ((s, r) => s + r.hands.length, 0);  const active = rounds.filter(r => r.status === 'active').length;  const playerStats = useMemo(() => players.map(player => {    let score = 0, wins = 0, second = 0, third = 0, hands = 0, penCount = 0, bonTotal = 0;    for (const round of rounds) {      const inRound = round.type === 'single'        ? round.participants.some(p => p.id === player.id)        : round.participants.some(t => (t.playerIds||[]).includes(player.id));      if (!inRound) continue;      for (const h of round.hands) {        hands++;        if (h.placements?.first  === player.id) wins++;        if (h.placements?.second === player.id) second++;        if (h.placements?.third  === player.id) third++;        score += calcScore(settings.points, [h], player.id);        if ((h.burned||[]).includes(player.id)) penCount++;        const bon = (h.bonuses||[]).find(b=>b.participantId===player.id);        if (bon) bonTotal += bon.amount;      }    }    return { player, score, wins, second, third, hands, penCount, bonTotal, winRate: hands ? Math.round(wins/hands*100) : 0 };  }).sort((a,b) => b.score - a.score), [rounds, players, settings]);  return (    <div className="fade-in">      <div className="stat-grid" style={{marginBottom:10}}>        {[          { v: rounds.length,  l: 'Rounds' },          { v: totalHands,     l: 'Hands' },          { v: players.length, l: 'Players' },          { v: active,         l: 'Active', c: active ? '#10b981' : undefined },        ].map(s => (          <div key={s.l} className="stat-box">            <div className="stat-value" style={s.c?{color:s.c}:{}}>{s.v}</div>            <div className="stat-label">{s.l}</div>          </div>        ))}      </div>      {playerStats.length > 0 && (        <div className="card">          <div className="card-title" style={{marginBottom:10}}>🏆 Leaderboard</div>          {playerStats.map((s, i) => (            <div key={s.player.id} className="lb-row" style={{background:'#0d0f18',border:'1px solid #1e2235'}}>              <div className={`lb-rank${i<3?` lb-rank-${i+1}`:''}`}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>              <div style={{fontSize:22}}>{s.player.avatar}</div>              <div style={{flex:1}}>                <div style={{fontWeight:600,fontSize:13,color:s.player.color||'#e2e8f0'}}>{s.player.name}</div>                <div style={{fontSize:10,color:'#64748b'}}>{s.hands} hands · {s.winRate}% win rate</div>              </div>              <div className="lb-score">{s.score>=0?'+':''}{s.score}</div>            </div>          ))}        </div>      )}      {playerStats.length > 0 && (        <div className="card">          <div className="card-title" style={{marginBottom:12}}>📊 Player Stats</div>          {playerStats.map((s, i) => (            <div key={s.player.id} style={{marginBottom:14,paddingBottom:14,borderBottom:i<playerStats.length-1?'1px solid #1e2235':'none'}}>              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:8}}>                <span style={{fontSize:20}}>{s.player.avatar}</span>                <span style={{fontWeight:600,fontSize:13,color:s.player.color||'#e2e8f0'}}>{s.player.name}</span>              </div>              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:5,marginBottom:s.hands?7:0}}>                {[                  { l:'Points',  v:s.score>=0?`+${s.score}`:s.score, c:s.score>=0?'#a78bfa':'#ef4444' },                  { l:'1st 🥇',  v:s.wins,     c:'#f59e0b' },                  { l:'Burned',  v:s.penCount,  c:'#ef4444' },                  { l:'Bonus',   v:`+${s.bonTotal}`, c:'#10b981' },                ].map(x => (                  <div key={x.l} style={{background:'#0d0f18',borderRadius:7,padding:'7px 4px',textAlign:'center',border:'1px solid #1e2235'}}>                    <div style={{fontSize:14,fontWeight:700,color:x.c}}>{x.v}</div>                    <div style={{fontSize:9,color:'#64748b',marginTop:1}}>{x.l}</div>                  </div>                ))}              </div>              {s.hands > 0 && (                <>                  <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#64748b',marginBottom:2}}>                    <span>Win rate</span><span>{s.winRate}%</span>                  </div>                  <div className="progress-bar">                    <div className="progress-fill" style={{width:`${s.winRate}%`}} />                  </div>                </>              )}            </div>          ))}        </div>      )}      {!players.length && (        <div className="empty-state">          <div className="empty-icon">📊</div>          <div className="empty-text">No data yet</div>          <div className="empty-sub">Add players in Settings and start a round</div>        </div>      )}    </div>  );}// ─── App ──────────────────────────────────────────────────────function App() {  const [tab, setTab]                       = useState('ground');  const [players, setPlayers]               = useState(() => store.get('cpt_players', []));  const [settings, setSettings]             = useState(() => store.get('cpt_settings', DEFAULT_SETTINGS));  const [rounds, setRounds]                 = useState(() => store.get('cpt_rounds', []));  const [activeRoundId, setActiveRoundId]   = useState(() => store.get('cpt_active', null));  useEffect(() => store.set('cpt_players',  players),       [players]);  useEffect(() => store.set('cpt_settings', settings),      [settings]);  useEffect(() => store.set('cpt_rounds',   rounds),        [rounds]);  useEffect(() => store.set('cpt_active',   activeRoundId), [activeRoundId]);  const activeRound = rounds.find(r => r.id === activeRoundId);  const TABS = [    { id: 'ground',    icon: '🎴', label: 'Play'     },    { id: 'history',   icon: '📜', label: 'History'  },    { id: 'dashboard', icon: '📊', label: 'Stats'    },    { id: 'settings',  icon: '⚙️', label: 'Settings' },  ];  return (    <div className="app">      <div className="header">        <div className="header-logo">🃏</div>        <div>          <div className="header-title">Card Tracker</div>          <div className="header-sub">            {activeRound ? `▶ ${activeRound.name}` : `${players.length} player${players.length!==1?'s':''} · ${rounds.length} round${rounds.length!==1?'s':''}`}          </div>        </div>      </div>      <div className="tab-content">        {tab === 'ground'    && <PlayingGroundTab players={players} rounds={rounds} setRounds={setRounds} activeRoundId={activeRoundId} setActiveRoundId={setActiveRoundId} settings={settings} />}        {tab === 'history'   && <HistoryTab rounds={rounds} players={players} settings={settings} />}        {tab === 'dashboard' && <DashboardTab rounds={rounds} players={players} settings={settings} />}        {tab === 'settings'  && <SettingsTab players={players} setPlayers={setPlayers} settings={settings} setSettings={setSettings} />}      </div>      <div className="bottom-nav">        {TABS.map(t => (          <button key={t.id} className={`nav-item${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>            <span className="nav-icon">{t.icon}</span>            <span>{t.label}</span>          </button>        ))}      </div>    </div>  );}ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
