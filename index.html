<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Card Points Tracker</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0f18}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;background:#0d0f18;color:#e2e8f0}
#root{height:100%;display:flex;flex-direction:column;align-items:center}
.app{display:flex;flex-direction:column;width:100%;max-width:480px;height:100dvh;overflow:hidden;position:relative}

/* Header */
.header{background:linear-gradient(135deg,#1a1d2e 0%,#16213e 100%);padding:clamp(10px,3vw,14px) clamp(14px,4vw,18px) 10px;border-bottom:1px solid #2d3561;display:flex;align-items:center;gap:12px;flex-shrink:0;padding-top:calc(clamp(10px,3vw,14px) + env(safe-area-inset-top))}
.header-logo{font-size:clamp(22px,6vw,26px)}
.header-title{font-size:clamp(16px,5vw,19px);font-weight:700;color:#a78bfa;letter-spacing:-0.3px}
.header-sub{font-size:11px;color:#64748b;margin-top:1px}

/* Tab content */
.tab-content{flex:1;overflow-y:auto;padding:clamp(10px,3vw,14px);-webkit-overflow-scrolling:touch}

/* Bottom nav */
.bottom-nav{display:flex;background:#1a1d2e;border-top:1px solid #2d3561;padding:10px 0 calc(12px + env(safe-area-inset-bottom));flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;min-height:58px;cursor:pointer;border:none;background:none;color:#64748b;font-size:12px;font-weight:500;letter-spacing:0.3px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.nav-item.active{color:#a78bfa}
.nav-icon{font-size:26px;line-height:1}

/* Cards */
.card{background:#1a1d2e;border:1px solid #2d3561;border-radius:14px;padding:14px;margin-bottom:10px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;color:#c4b5fd}
.section-title{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;min-height:44px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .18s;line-height:1;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:white}
.btn-primary:not(:disabled):active{filter:brightness(1.12)}
.btn-secondary{background:#2d3561;color:#c4b5fd}
.btn-secondary:active{background:#3d4571}
.btn-danger{background:#7f1d1d;color:#fca5a5}
.btn-success{background:#064e3b;color:#6ee7b7}
.btn-sm{padding:5px 9px;min-height:36px;font-size:11px;border-radius:7px}
.btn-icon{padding:6px;min-height:36px;min-width:36px;border-radius:8px}
.btn-full{width:100%}
.btn-ghost{background:transparent;color:#94a3b8}
.btn-ghost:active{background:#1e2235;color:#e2e8f0}

/* Forms */
.form-group{margin-bottom:13px}
.form-label{display:block;font-size:11px;font-weight:500;color:#94a3b8;margin-bottom:5px;letter-spacing:.3px}
.form-input{width:100%;padding:11px;min-height:44px;background:#0d0f18;border:1px solid #2d3561;border-radius:9px;color:#e2e8f0;font-size:16px;outline:none;transition:border-color .18s}
.form-input:focus{border-color:#7c3aed}
.form-input::placeholder{color:#475569}
input[type="date"].form-input{color-scheme:dark}
input[type="date"].form-input::-webkit-calendar-picker-indicator{filter:invert(0.7) sepia(1) saturate(3) hue-rotate(220deg);cursor:pointer;padding:2px;border-radius:4px}
input[type="date"].form-input::-webkit-calendar-picker-indicator:hover{filter:invert(0.9) sepia(1) saturate(3) hue-rotate(220deg)}

/* Add-hand position grid — responsive */
.hand-slot-grid{display:grid;grid-template-columns:72px 1fr 58px;gap:6px;align-items:center;margin-bottom:7px}
@media(max-width:360px){.hand-slot-grid{grid-template-columns:62px 1fr 50px;gap:4px}}
.hand-slot-label{background:#0d0f18;border:1px solid #1e2235;border-radius:8px;padding:7px 5px;display:flex;align-items:center;gap:4px}
.hand-slot-bonus{padding:8px 4px;font-size:12px;text-align:center;min-height:44px}

/* Emoji grid */
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
@media(max-width:360px){.emoji-grid{grid-template-columns:repeat(5,1fr)}}

/* Player chip */
.player-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:500;background:#2d3561;border:1px solid #3d4571}
.player-avatar{font-size:16px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:1000}
.modal{background:#1a1d2e;border:1px solid #2d3561;border-radius:20px 20px 0 0;padding:22px 18px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;animation:slideUp .22s ease;-webkit-overflow-scrolling:touch}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:17px;font-weight:700;color:#c4b5fd;margin-bottom:18px}

/* List items */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#0d0f18;border-radius:11px;margin-bottom:7px;border:1px solid #1e2235}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:600}
.badge-gold{background:#78350f;color:#fde68a}
.badge-silver{background:#334155;color:#cbd5e1}
.badge-bronze{background:#431407;color:#fdba74}
.badge-4th{background:#1e3a5f;color:#93c5fd}
.badge-jackpot{background:#78350f;color:#fcd34d}
.badge-penalty{background:#7f1d1d;color:#fca5a5}
.badge-bonus{background:#064e3b;color:#6ee7b7}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-box{background:#0d0f18;border:1px solid #1e2235;border-radius:12px;padding:13px;text-align:center}
.stat-value{font-size:26px;font-weight:700;color:#a78bfa}
.stat-label{font-size:10px;color:#64748b;margin-top:2px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}

/* Toggle */
.toggle-group{display:flex;background:#0d0f18;border-radius:9px;padding:3px;gap:3px}
.toggle-option{flex:1;padding:7px;text-align:center;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;border:none;background:none;transition:all .18s}
.toggle-option.active{background:#7c3aed;color:white}

/* Emoji grid */
.emoji-btn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:23px;border-radius:9px;cursor:pointer;border:2px solid transparent;background:#0d0f18;transition:all .13s}
.emoji-btn.selected{border-color:#7c3aed;background:#2e1065}
.emoji-btn:active{background:#1e2235}

/* Color picker */
.color-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .13s}
.color-dot.selected{border-color:white;transform:scale(1.22)}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;margin-bottom:5px}
.lb-rank{width:22px;text-align:center;font-weight:700;font-size:13px;color:#64748b}
.lb-rank-1{color:#f59e0b}
.lb-rank-2{color:#94a3b8}
.lb-rank-3{color:#fb923c}
.lb-score{margin-left:auto;font-weight:700;font-size:15px;color:#a78bfa}

/* Checkbox */
.checkbox-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;background:#0d0f18;border:1px solid #1e2235;margin-bottom:5px;transition:all .13s}
.checkbox-item.checked{border-color:#7c3aed;background:#2e1065}
.checkbox{width:17px;height:17px;border-radius:5px;border:2px solid #3d4571;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.checkbox.checked{background:#7c3aed;border-color:#7c3aed}

/* Number stepper */
.num-btn{width:30px;height:30px;border-radius:7px;background:#2d3561;border:none;color:#c4b5fd;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.num-btn:disabled{opacity:.4;cursor:not-allowed}
.num-val{font-size:15px;font-weight:600;min-width:28px;text-align:center}

/* Progress bar */
.progress-bar{height:5px;border-radius:3px;background:#1e2235;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .5s}

/* Hand row */
.hand-row{padding:9px 11px;background:#0d0f18;border-radius:9px;margin-bottom:5px;border:1px solid #1e2235}
.hand-num{font-size:10px;color:#64748b;font-weight:500;margin-bottom:5px}
.hand-placements{display:flex;flex-wrap:wrap;gap:4px}

/* Round status */
.status-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#6ee7b7;font-weight:500}
.status-dot-live{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Misc */
.divider{height:1px;background:#1e2235;margin:12px 0}
.empty-state{text-align:center;padding:36px 20px;color:#475569}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-text{font-size:14px;font-weight:500;color:#64748b}
.empty-sub{font-size:12px;margin-top:4px}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2d3561;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const DEFAULT_SETTINGS = { points: { jackpot: 5, first: 3, second: 2, third: 1, fourth: 0, penalty: -1 } };

const EMOJIS = ['🦁','🐯','🐻','🦊','🐼','🦅','🐲','🎭','🃏','♟️','🎯','⚡','🔥','❄️','🌊','👑','🥷','😎','🤠','🎪','🦋','🌸','🍀','⭐','💎','🏆','🎸','🚀','🌙','🦄'];
const COLORS = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9','#FF9FF3','#54A0FF','#5F27CD','#01CBC6','#FF9F43'];

const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let _id = Date.now();
const uid = () => String(++_id);

const fmtDate = ts => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

const calcScore = (pts, hands, pid) => {
  let t = 0;
  for (const h of hands) {
    if (h.placements?.jackpot === pid) t += (pts.jackpot ?? 20);
    if (h.placements?.first === pid) t += pts.first;
    if (h.placements?.second === pid) t += pts.second;
    if (h.placements?.third === pid) t += pts.third;
    if (h.placements?.fourth === pid) t += pts.fourth;
    if ((h.burned || []).includes(pid)) t += pts.penalty;
    for (const b of (h.bonuses || [])) if (b.participantId === pid) t += b.amount;
  }
  return t;
};

// ─── CheckItem ───────────────────────────────────────────────
function CheckItem({ checked, onClick, children }) {
  return (
    <div className={`checkbox-item${checked ? ' checked' : ''}`} onClick={onClick}>
      <div className={`checkbox${checked ? ' checked' : ''}`}>
        {checked && <span style={{color:'white',fontSize:10}}>✓</span>}
      </div>
      <div style={{flex:1}}>{children}</div>
    </div>
  );
}

// ─── PlayerChip ───────────────────────────────────────────────
function PlayerChip({ player }) {
  if (!player) return null;
  return (
    <div className="player-chip" style={{borderColor:player.color+'44',background:player.color+'18'}}>
      <div className="player-avatar" style={{background:player.color+'28'}}>{player.avatar}</div>
      <span style={{color:player.color||'#e2e8f0'}}>{player.name}</span>
    </div>
  );
}

// ─── PlayerModal ──────────────────────────────────────────────
function PlayerModal({ player, onSave, onClose }) {
  const [name, setName] = useState(player?.name || '');
  const [avatar, setAvatar] = useState(player?.avatar || EMOJIS[0]);
  const [color, setColor] = useState(player?.color || COLORS[0]);

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">{player ? 'Edit Player' : 'Add Player'}</div>
        <div className="form-group">
          <label className="form-label">Name</label>
          <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder="Player name…" autoFocus />
        </div>
        <div className="form-group">
          <label className="form-label">Avatar</label>
          <div className="emoji-grid">
            {EMOJIS.map(e => (
              <button key={e} className={`emoji-btn${avatar===e?' selected':''}`} onClick={() => setAvatar(e)}>{e}</button>
            ))}
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Color</label>
          <div className="color-grid">
            {COLORS.map(c => (
              <div key={c} className={`color-dot${color===c?' selected':''}`} style={{background:c}} onClick={() => setColor(c)} />
            ))}
          </div>
        </div>
        <div style={{display:'flex',gap:8,marginTop:6}}>
          <button className="btn btn-secondary btn-full" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary btn-full" onClick={() => name.trim() && onSave({name:name.trim(),avatar,color})} disabled={!name.trim()}>
            {player ? 'Save Changes' : 'Add Player'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── NewRoundModal ────────────────────────────────────────────
function NewRoundModal({ players, onSave, onClose }) {
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const [name, setName] = useState(`Round ${new Date().toLocaleDateString()}`);
  const [note, setNote] = useState('');
  const [date, setDate] = useState(todayStr);
  const [type, setType] = useState('single');
  const [selectedPlayers, setSelectedPlayers] = useState(() => players.map(p => p.id));
  const [teams, setTeams] = useState([
    { id: uid(), name: 'Team A', playerIds: [] },
    { id: uid(), name: 'Team B', playerIds: [] }
  ]);

  const togglePlayer = id => setSelectedPlayers(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);

  const addTeam = () => setTeams(p => [...p, { id: uid(), name: `Team ${String.fromCharCode(65+p.length)}`, playerIds: [] }]);
  const removeTeam = id => setTeams(p => p.filter(t => t.id !== id));

  const toggleTeamPlayer = (teamId, playerId) => {
    setTeams(prev => {
      const inTeam = prev.find(t => t.id === teamId)?.playerIds.includes(playerId);
      const cleared = prev.map(t => ({ ...t, playerIds: t.playerIds.filter(p => p !== playerId) }));
      return cleared.map(t => t.id === teamId
        ? { ...t, playerIds: inTeam ? t.playerIds : [...t.playerIds, playerId] }
        : t
      );
    });
  };

  const canSave = type === 'single'
    ? selectedPlayers.length >= 2
    : teams.filter(t => t.playerIds.length > 0).length >= 2;

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">New Round</div>
        <div className="form-group">
          <label className="form-label">Round Name</label>
          <input className="form-input" value={name} onChange={e => setName(e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">Date</label>
          <input type="date" className="form-input" value={date} onChange={e => setDate(e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">Note <span style={{fontWeight:400,color:'#475569'}}>(optional)</span></label>
          <textarea className="form-input" rows={2} value={note} onChange={e => setNote(e.target.value)}
            placeholder="e.g. Friday night at John's place"
            style={{resize:'none',lineHeight:1.5}} />
        </div>
        <div className="form-group">
          <label className="form-label">Type</label>
          <div className="toggle-group">
            <button className={`toggle-option${type==='single'?' active':''}`} onClick={() => setType('single')}>👤 Individual</button>
            <button className={`toggle-option${type==='team'?' active':''}`} onClick={() => setType('team')}>👥 Team</button>
          </div>
        </div>

        {type === 'single' && (
          <div className="form-group">
            <label className="form-label">Players (select ≥ 2)</label>
            {players.length === 0
              ? <p style={{color:'#64748b',fontSize:12,padding:'8px 0'}}>No players yet — add some in Settings first.</p>
              : players.map(p => (
                <CheckItem key={p.id} checked={selectedPlayers.includes(p.id)} onClick={() => togglePlayer(p.id)}>
                  <PlayerChip player={p} />
                </CheckItem>
              ))
            }
          </div>
        )}

        {type === 'team' && (
          <div className="form-group">
            <label className="form-label">Teams</label>
            {teams.map(team => (
              <div key={team.id} className="card" style={{marginBottom:8,padding:11}}>
                <div style={{display:'flex',gap:7,alignItems:'center',marginBottom:9}}>
                  <input className="form-input" value={team.name} style={{flex:1}}
                    onChange={e => setTeams(p => p.map(t => t.id===team.id ? {...t,name:e.target.value} : t))} />
                  {teams.length > 2 && (
                    <button className="btn btn-icon btn-danger btn-sm" onClick={() => removeTeam(team.id)}>✕</button>
                  )}
                </div>
                {players.map(p => (
                  <CheckItem key={p.id} checked={team.playerIds.includes(p.id)}
                    onClick={() => toggleTeamPlayer(team.id, p.id)}>
                    <PlayerChip player={p} />
                  </CheckItem>
                ))}
                {players.length === 0 && <p style={{color:'#64748b',fontSize:12}}>Add players in Settings first.</p>}
              </div>
            ))}
            <button className="btn btn-secondary btn-sm" onClick={addTeam}>+ Add Team</button>
          </div>
        )}

        <div style={{display:'flex',gap:8,marginTop:8}}>
          <button className="btn btn-secondary btn-full" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary btn-full" disabled={!canSave} onClick={() => {
            onSave({
              id: uid(),
              name: name.trim() || 'Round',
              note: note.trim(),
              type,
              participants: type === 'single'
                ? selectedPlayers.map(id => ({ id, type: 'player' }))
                : teams.filter(t => t.playerIds.length > 0).map(t => ({ id: t.id, type: 'team', name: t.name, playerIds: t.playerIds })),
              hands: [],
              status: 'active',
              createdAt: date ? new Date(date).getTime() : Date.now()
            });
          }}>Start Round</button>
        </div>
      </div>
    </div>
  );
}

// ─── RoundLineChart ───────────────────────────────────────────
function RoundLineChart({ round, players, pts }) {
  const hands = round.hands;
  if (!hands.length) return null;

  const TEAM_COLORS = ['#c4b5fd','#6ee7b7','#fcd34d','#f87171','#60a5fa','#fb923c'];

  const series = round.type === 'single'
    ? round.participants.map(p => {
        const player = players.find(pl => pl.id === p.id);
        let cum = 0;
        const points = [0];
        for (const h of hands) { cum += calcScore(pts, [h], p.id); points.push(cum); }
        return { id: p.id, name: player?.name || '?', color: player?.color || '#94a3b8', points };
      })
    : round.participants.map((t, ti) => {
        let cum = 0;
        const points = [0];
        for (const h of hands) {
          cum += (t.playerIds || []).reduce((s, pid) => s + calcScore(pts, [h], pid), 0);
          points.push(cum);
        }
        return { id: t.id, name: t.name, color: TEAM_COLORS[ti % TEAM_COLORS.length], points };
      });

  const W = 320, H = 160;
  const pad = { top: 18, right: 44, bottom: 24, left: 36 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;
  const n = hands.length;

  const allY = series.flatMap(s => s.points);
  const minY = Math.min(0, ...allY);
  const maxY = Math.max(0, ...allY);
  const yRange = maxY - minY || 1;

  const xS = i => pad.left + (i / n) * cW;
  const yS = y => pad.top + cH - ((y - minY) / yRange) * cH;
  const fmt = v => v > 0 ? `+${v}` : `${v}`;

  const yTicks = [...new Set([minY, 0, maxY])];

  return (
    <div style={{background:'#0a0c14',borderRadius:10,padding:'10px 4px 4px',marginBottom:10,border:'1px solid #1e2235'}}>
      <div style={{fontSize:11,color:'#64748b',fontWeight:600,marginBottom:2,paddingLeft:8}}>📈 Points Timeline</div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',overflow:'visible'}}>
        {/* horizontal grid + y labels */}
        {yTicks.map(v => (
          <g key={v}>
            <line x1={pad.left} y1={yS(v)} x2={W - pad.right} y2={yS(v)}
              stroke={v === 0 ? '#2d3561' : '#14172a'} strokeWidth={v === 0 ? 1.5 : 1} />
            <text x={pad.left - 4} y={yS(v) + 3.5} textAnchor="end" fill="#475569" fontSize={9}>{fmt(v)}</text>
          </g>
        ))}
        {/* x labels */}
        {Array.from({ length: n }, (_, i) => (
          <text key={i} x={xS(i + 1)} y={H - 5} textAnchor="middle" fill="#475569" fontSize={9}>{i + 1}</text>
        ))}
        {/* series */}
        {series.map(s => {
          const d = s.points.map((y, i) => `${i === 0 ? 'M' : 'L'}${xS(i).toFixed(1)},${yS(y).toFixed(1)}`).join(' ');
          const last = s.points[s.points.length - 1];
          return (
            <g key={s.id}>
              <path d={d} fill="none" stroke={s.color} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />
              {s.points.map((y, i) => i > 0 && (
                <circle key={i} cx={xS(i)} cy={yS(y)} r={3} fill={s.color} stroke="#0a0c14" strokeWidth={1.5} />
              ))}
              <text x={xS(n) + 5} y={yS(last) + 4} fill={s.color} fontSize={9} fontWeight="600">{s.name}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ─── AddHandModal ─────────────────────────────────────────────
function AddHandModal({ round, players, pts, onSave, onClose }) {
  const [assignments, setAssignments] = useState({});
  const [bonuses, setBonuses] = useState({});
  const setBonus = (pid, val) => setBonuses(prev => ({ ...prev, [pid]: val }));

  const participants = round.type === 'single'
    ? (round.participants || []).map(p => {
        const player = players.find(pl => pl.id === p.id);
        return { id: p.id, label: player?.name || '?', player };
      })
    : (round.participants || []).flatMap(t =>
        (t.playerIds || []).map(pid => {
          const player = players.find(pl => pl.id === pid);
          return { id: pid, label: player?.name || '?', player, teamName: t.name };
        })
      );

  const POSITIONS = [
    { key: 'jackpot', emoji: '🏆', label: 'Jackpot', pts: pts.jackpot ?? 20, color: '#fcd34d', unique: true },
    { key: 'first',   emoji: '🥇', label: '1st',     pts: pts.first,          color: '#f59e0b', unique: true },
    { key: 'second',  emoji: '🥈', label: '2nd',     pts: pts.second,         color: '#94a3b8', unique: true },
    { key: 'third',   emoji: '🥉', label: '3rd',     pts: pts.third,          color: '#fb923c', unique: true },
    { key: 'fourth',  emoji: '4️⃣', label: '4th',    pts: pts.fourth,         color: '#818cf8', unique: true },
    { key: 'burned',  emoji: '🔥', label: 'Burned',  pts: pts.penalty,        color: '#ef4444', unique: false },
  ];

  // Track which unique positions are taken and by whom
  const takenUnique = {};
  for (const [pid, pos] of Object.entries(assignments)) {
    if (pos && pos !== 'burned') takenUnique[pos] = pid;
  }

  const setAssignment = (pid, pos) => {
    if (pos === 'jackpot') {
      const auto = {};
      for (const p of participants) auto[p.id] = p.id === pid ? 'jackpot' : 'fourth';
      setAssignments(auto);
    } else {
      setAssignments(prev => ({ ...prev, [pid]: pos }));
    }
  };

  const totalAssigned = participants.filter(p => assignments[p.id]).length;
  const required = participants.length;
  const canSave = required > 0 && totalAssigned === required;

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">Hand #{round.hands.length + 1}</div>

        <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:10}}>
          {participants.map(p => {
            const assigned = assignments[p.id] || '';
            const posInfo = POSITIONS.find(x => x.key === assigned);
            return (
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:'#0d0f18',borderRadius:8,border:`1px solid ${assigned ? '#2d3561' : '#1e2235'}`}}>
                <span style={{fontSize:18}}>{p.player?.avatar || '👥'}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:'#e2e8f0',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                    {p.label}{p.teamName ? <span style={{fontSize:11,color:'#64748b'}}> ({p.teamName})</span> : ''}
                  </div>
                  {posInfo && (
                    <div style={{fontSize:10,color:posInfo.color,marginTop:1}}>
                      {posInfo.emoji} {posInfo.label} ({posInfo.pts > 0 ? '+' : ''}{posInfo.pts}pt)
                    </div>
                  )}
                </div>
                <select
                  className="form-input"
                  value={assigned}
                  onChange={e => setAssignment(p.id, e.target.value)}
                  style={{width:115,padding:'7px 8px',fontSize:12,flexShrink:0}}
                >
                  <option value="">— Position —</option>
                  {POSITIONS.map(pos => {
                    const takenByOther = pos.unique && takenUnique[pos.key] && takenUnique[pos.key] !== p.id;
                    return (
                      <option key={pos.key} value={pos.key} disabled={takenByOther}>
                        {pos.emoji} {pos.label} ({pos.pts > 0 ? '+' : ''}{pos.pts}pt)
                      </option>
                    );
                  })}
                </select>
                <input
                  type="number"
                  inputMode="numeric"
                  className="form-input"
                  placeholder="🎁"
                  value={bonuses[p.id] || ''}
                  onChange={e => setBonus(p.id, e.target.value)}
                  style={{width:54,padding:'7px 6px',fontSize:12,textAlign:'center',flexShrink:0,border:'1px solid #064e3b',background: bonuses[p.id] ? '#052e16' : '#0d0f18',color:'#6ee7b7'}}
                />
              </div>
            );
          })}
        </div>

        {/* Progress indicator */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,padding:'6px 10px',background:'#0d0f18',borderRadius:8,border:`1px solid ${canSave?'#064e3b':'#1e2235'}`}}>
          <span style={{fontSize:11,color:'#64748b'}}>Players assigned</span>
          <span style={{fontSize:12,fontWeight:700,color: canSave ? '#6ee7b7' : '#94a3b8'}}>
            {totalAssigned} / {required}
          </span>
        </div>

        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary btn-full" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary btn-full" disabled={!canSave} onClick={() => {
            const placements = {};
            const burned = [];
            const bonusList = [];
            for (const p of participants) {
              const pos = assignments[p.id];
              if (pos === 'burned') burned.push(p.id);
              else if (pos) placements[pos] = p.id;
              const bon = parseInt(bonuses[p.id]) || 0;
              if (bon) bonusList.push({ participantId: p.id, amount: bon });
            }
            onSave({ id: uid(), placements, burned, bonuses: bonusList, createdAt: Date.now() });
          }}>Save Hand</button>
        </div>
      </div>
    </div>
  );
}

// ─── SettingsTab ──────────────────────────────────────────────
function SettingsTab({ players, setPlayers, settings, setSettings, rounds, setRounds, activeRoundId, setActiveRoundId }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editP, setEditP] = useState(null);
  const [syncToken, setSyncToken] = useState(() => store.get('cpt_sync_token', ''));
  const [syncGist, setSyncGist]   = useState(() => store.get('cpt_sync_gist', ''));
  const [syncStatus, setSyncStatus] = useState('');
  const [syncing, setSyncing] = useState(false);

  const saveToken = v => { setSyncToken(v); store.set('cpt_sync_token', v); };
  const saveGist  = v => { setSyncGist(v);  store.set('cpt_sync_gist', v); };

  const pushToCloud = async () => {
    if (!syncToken) { setSyncStatus('✗ Personal Access Token required'); return; }
    setSyncing(true); setSyncStatus('Pushing…');
    const payload = { players, settings, rounds, activeRoundId };
    const body = { description: 'Card Tracker Sync', files: { 'card-tracker-data.json': { content: JSON.stringify(payload) } } };
    try {
      let res, json;
      if (syncGist) {
        res = await fetch(`https://api.github.com/gists/${syncGist}`, {
          method: 'PATCH',
          headers: { Authorization: `token ${syncToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } else {
        res = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: { Authorization: `token ${syncToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...body, public: false })
        });
      }
      json = await res.json();
      if (!res.ok) throw new Error(json.message || String(res.status));
      if (json.id && !syncGist) saveGist(json.id);
      setSyncStatus('✓ Pushed at ' + new Date().toLocaleTimeString());
    } catch (e) { setSyncStatus('✗ ' + e.message); }
    setSyncing(false);
  };

  const pullFromCloud = async () => {
    if (!syncToken || !syncGist) { setSyncStatus('✗ Token and Gist ID both required'); return; }
    setSyncing(true); setSyncStatus('Pulling…');
    try {
      const res = await fetch(`https://api.github.com/gists/${syncGist}`, {
        headers: { Authorization: `token ${syncToken}` }
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || String(res.status));
      const content = json.files?.['card-tracker-data.json']?.content;
      if (!content) throw new Error('No data found in gist');
      const d = JSON.parse(content);
      if (d.players)       setPlayers(d.players);
      if (d.settings)      setSettings(d.settings);
      if (d.rounds)        setRounds(d.rounds);
      if ('activeRoundId' in d) setActiveRoundId(d.activeRoundId);
      setSyncStatus('✓ Pulled at ' + new Date().toLocaleTimeString());
    } catch (e) { setSyncStatus('✗ ' + e.message); }
    setSyncing(false);
  };

  const savePlayer = data => {
    if (editP) { setPlayers(p => p.map(x => x.id === editP.id ? { ...x, ...data } : x)); setEditP(null); }
    else { setPlayers(p => [...p, { id: uid(), ...data }]); setShowAdd(false); }
  };

  const delPlayer = id => confirm('Delete this player?') && setPlayers(p => p.filter(x => x.id !== id));

  const pts = settings.points;
  const setPoint = (k, v) => setSettings(s => ({ ...s, points: { ...s.points, [k]: parseInt(v) || 0 } }));

  const pointRows = [
    { key: 'jackpot', label: '🏆 Jackpot',   col: '#fcd34d' },
    { key: 'first',   label: '🥇 1st Place', col: '#f59e0b' },
    { key: 'second',  label: '🥈 2nd Place', col: '#94a3b8' },
    { key: 'third',   label: '🥉 3rd Place', col: '#fb923c' },
    { key: 'fourth',  label: '4️⃣ 4th Place', col: '#818cf8' },
    { key: 'penalty', label: '🔥 Burned',     col: '#ef4444' },
  ];

  return (
    <div className="fade-in">
      <div className="card">
        <div className="card-header">
          <div className="card-title">👥 Players</div>
          <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>+ Add</button>
        </div>
        {players.length === 0 && (
          <div style={{textAlign:'center',padding:'16px 0',color:'#475569'}}>
            <div style={{fontSize:30,marginBottom:6}}>👤</div>
            <div style={{fontSize:12}}>No players yet. Tap Add to get started!</div>
          </div>
        )}
        {players.map(p => (
          <div key={p.id} className="list-item">
            <div style={{fontSize:26,width:38,height:38,display:'flex',alignItems:'center',justifyContent:'center',background:p.color+'1e',borderRadius:9}}>
              {p.avatar}
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,color:p.color||'#e2e8f0'}}>{p.name}</div>
            </div>
            <button className="btn btn-icon btn-ghost" onClick={() => setEditP(p)}>✏️</button>
            <button className="btn btn-icon btn-ghost" style={{color:'#ef4444'}} onClick={() => delPlayer(p.id)}>🗑️</button>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-title" style={{marginBottom:14}}>🏆 Point Values</div>
        {pointRows.map(r => (
          <div key={r.key} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
            <div style={{flex:1,fontSize:13,color:r.col}}>{r.label}</div>
            <input type="number" className="form-input" style={{width:72,textAlign:'center'}}
              value={pts[r.key]} onChange={e => setPoint(r.key, e.target.value)} />
            <span style={{fontSize:11,color:'#64748b',width:20}}>pts</span>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-title" style={{marginBottom:14}}>☁️ Cloud Sync</div>
        <div style={{fontSize:11,color:'#64748b',marginBottom:12,lineHeight:1.6}}>
          Sync data across devices via a private GitHub Gist. Create a token at github.com → Settings → Developer settings → Personal access tokens → with <strong style={{color:'#94a3b8'}}>gist</strong> scope.
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#94a3b8',marginBottom:4,fontWeight:600}}>Personal Access Token</div>
          <input
            type="password"
            className="form-input"
            placeholder="ghp_xxxxxxxxxxxx"
            value={syncToken}
            onChange={e => saveToken(e.target.value)}
            style={{width:'100%',boxSizing:'border-box'}}
          />
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:'#94a3b8',marginBottom:4,fontWeight:600}}>Gist ID <span style={{fontWeight:400,color:'#475569'}}>(auto-filled after first push)</span></div>
          <input
            type="text"
            className="form-input"
            placeholder="e.g. a1b2c3d4e5f6..."
            value={syncGist}
            onChange={e => saveGist(e.target.value)}
            style={{width:'100%',boxSizing:'border-box'}}
          />
        </div>
        <div style={{display:'flex',gap:8,marginBottom:syncStatus?10:0}}>
          <button className="btn btn-primary btn-full" disabled={syncing} onClick={pushToCloud}>
            {syncing ? '…' : '⬆ Push'}
          </button>
          <button className="btn btn-secondary btn-full" disabled={syncing} onClick={pullFromCloud}>
            {syncing ? '…' : '⬇ Pull'}
          </button>
        </div>
        {syncStatus && (
          <div style={{fontSize:11,padding:'6px 10px',borderRadius:6,background: syncStatus.startsWith('✓') ? '#052e16' : '#1a0a0a', color: syncStatus.startsWith('✓') ? '#6ee7b7' : '#fca5a5', border: `1px solid ${syncStatus.startsWith('✓') ? '#065f46' : '#7f1d1d'}`}}>
            {syncStatus}
          </div>
        )}
      </div>

      {(showAdd || editP) && (
        <PlayerModal player={editP} onSave={savePlayer} onClose={() => { setShowAdd(false); setEditP(null); }} />
      )}
    </div>
  );
}

// ─── HistoryTab ───────────────────────────────────────────────
function HistoryTab({ rounds, players, settings }) {
  const [expanded, setExpanded] = useState(null);

  // Placements always store player IDs now
  const getPlayerName = pid => players.find(p => p.id === pid)?.name || '?';

  const teamScore = (team, hands) =>
    team.playerIds.reduce((sum, pid) => sum + calcScore(settings.points, hands, pid), 0);

  const sorted = [...rounds].sort((a, b) => b.createdAt - a.createdAt);

  if (!rounds.length) return (
    <div className="empty-state fade-in">
      <div className="empty-icon">📜</div>
      <div className="empty-text">No rounds yet</div>
      <div className="empty-sub">Start playing to build history</div>
    </div>
  );

  return (
    <div className="fade-in">
      {sorted.map(round => {
        const isExp = expanded === round.id;
        const scores = (round.type === 'single'
          ? round.participants.map(p => ({ ...p, score: calcScore(settings.points, round.hands, p.id) }))
          : round.participants.map(t => ({ ...t, score: teamScore(t, round.hands) }))
        ).sort((a, b) => b.score - a.score);

        return (
          <div key={round.id} className="card" style={{cursor:'pointer'}} onClick={() => setExpanded(isExp ? null : round.id)}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
              <div style={{fontSize:28}}>🃏</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14,marginBottom:3}}>{round.name}</div>
                <div style={{fontSize:11,color:'#64748b',display:'flex',gap:8,flexWrap:'wrap'}}>
                  <span>{fmtDate(round.createdAt)}</span>
                  <span>· {round.hands.length} hand{round.hands.length!==1?'s':''}</span>
                  <span>· {round.type==='team'?'👥 Team':'👤 Individual'}</span>
                </div>
                {round.note && <div style={{fontSize:11,color:'#94a3b8',marginTop:3,fontStyle:'italic'}}>📝 {round.note}</div>}
                <div style={{marginTop:5}}>
                  {round.status === 'active'
                    ? <div className="status-live"><div className="status-dot-live" style={{width:6,height:6,borderRadius:'50%',background:'#10b981',animation:'pulse 2s infinite',display:'inline-block'}}></div> In Progress</div>
                    : <span style={{fontSize:11,color:'#475569'}}>✓ Completed</span>
                  }
                </div>
              </div>
              <span style={{fontSize:11,color:'#475569',paddingTop:2}}>{isExp?'▲':'▼'}</span>
            </div>

            {isExp && (
              <div style={{marginTop:14}} onClick={e => e.stopPropagation()}>
                <div className="divider" />
                <div className="section-title">Scores</div>
                {scores.map((p, i) => {
                  const pl = round.type==='single' ? players.find(x=>x.id===p.id) : null;
                  const total = round.hands.length;
                  const pStats = pid => ({
                    wins:   total ? Math.round(round.hands.filter(h => h.placements?.first === pid).length / total * 100) : 0,
                    burned: total ? Math.round(round.hands.filter(h => (h.burned||[]).includes(pid)).length / total * 100) : 0,
                  });
                  return (
                    <div key={p.id} style={{marginBottom:6}}>
                      <div className="lb-row" style={{background:'#0d0f18',border:'1px solid #1e2235',marginBottom:0}}>
                        <div className={`lb-rank${i<3?` lb-rank-${i+1}`:''}`}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
                        {pl && <span style={{fontSize:18}}>{pl.avatar}</span>}
                        {!pl && <span>👥</span>}
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:13,color:pl?.color||'#e2e8f0'}}>{round.type==='single'?pl?.name||'?':p.name}</div>
                          {round.type==='single' && total > 0 && (() => { const s = pStats(p.id); return (
                            <div style={{fontSize:10,color:'#64748b',marginTop:1}}>🥇 {s.wins}% win · 🔥 {s.burned}% burned</div>
                          ); })()}
                        </div>
                        <span className="lb-score">{p.score>=0?'+':''}{p.score}</span>
                      </div>
                      {round.type==='team' && (p.playerIds||[]).map(pid => {
                        const member = players.find(x => x.id === pid);
                        const ms = calcScore(settings.points, round.hands, pid);
                        const s = pStats(pid);
                        return (
                          <div key={pid} style={{display:'flex',alignItems:'center',gap:7,padding:'4px 10px 4px 36px',background:'#0a0c14',borderLeft:'2px solid #2d3561',marginTop:1}}>
                            <span style={{fontSize:14}}>{member?.avatar||'?'}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:11,color:member?.color||'#94a3b8'}}>{member?.name||'?'}</div>
                              {total > 0 && <div style={{fontSize:10,color:'#475569'}}>🥇 {s.wins}% · 🔥 {s.burned}%</div>}
                            </div>
                            <span style={{fontSize:11,fontWeight:600,color:ms>=0?'#a78bfa':'#ef4444'}}>{ms>=0?'+':''}{ms}</span>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}

                <RoundLineChart round={round} players={players} pts={settings.points} />
                <div className="section-title" style={{marginTop:12}}>Hands</div>
                {round.hands.length === 0 && <div style={{color:'#475569',fontSize:12,padding:8,textAlign:'center'}}>No hands yet</div>}
                {round.hands.map((h, hi) => (
                  <div key={h.id} className="hand-row">
                    <div className="hand-num">Hand #{hi+1}</div>
                    <div className="hand-placements">
                      {h.placements?.jackpot && <span className="badge badge-jackpot">🏆 {getPlayerName(h.placements.jackpot)}</span>}
                      {h.placements?.first  && <span className="badge badge-gold">🥇 {getPlayerName(h.placements.first)}</span>}
                      {h.placements?.second && <span className="badge badge-silver">🥈 {getPlayerName(h.placements.second)}</span>}
                      {h.placements?.third  && <span className="badge badge-bronze">🥉 {getPlayerName(h.placements.third)}</span>}
                      {h.placements?.fourth && <span className="badge badge-4th">4️⃣ {getPlayerName(h.placements.fourth)}</span>}
                      {(h.burned||[]).map(pid=><span key={pid} className="badge badge-penalty">🔥 {getPlayerName(pid)}</span>)}
                      {(h.bonuses||[]).map(bon=><span key={bon.participantId} className="badge badge-bonus">🎁+{bon.amount} {getPlayerName(bon.participantId)}</span>)}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── PlayingGroundTab ─────────────────────────────────────────
function PlayingGroundTab({ players, rounds, setRounds, activeRoundId, setActiveRoundId, settings }) {
  const [showNew, setShowNew] = useState(false);
  const [showHand, setShowHand] = useState(false);

  const round = rounds.find(r => r.id === activeRoundId);

  const startRound = data => { setRounds(p => [...p, data]); setActiveRoundId(data.id); setShowNew(false); };
  const addHand = hand => { setRounds(p => p.map(r => r.id === activeRoundId ? { ...r, hands: [...r.hands, hand] } : r)); setShowHand(false); };
  const finishRound = () => {
    if (confirm('Mark this round as completed?')) {
      setRounds(p => p.map(r => r.id === activeRoundId ? { ...r, status: 'completed' } : r));
      setActiveRoundId(null);
    }
  };

  // Placements always store player IDs
  const getPlayerName   = pid => players.find(p => p.id === pid)?.name   || '?';
  const getPlayerAvatar = pid => players.find(p => p.id === pid)?.avatar || '?';
  const getPlayerColor  = pid => players.find(p => p.id === pid)?.color  || '#e2e8f0';

  const teamScore = (team, hands) =>
    team.playerIds.reduce((sum, pid) => sum + calcScore(settings.points, hands, pid), 0);

  // No active round — lobby screen
  if (!round) {
    const inProgress = rounds.filter(r => r.status === 'active');
    return (
      <div className="fade-in">
        <div style={{textAlign:'center',padding:'28px 20px 22px'}}>
          <div style={{fontSize:60,marginBottom:10}}>🎴</div>
          <div style={{fontSize:19,fontWeight:700,color:'#c4b5fd',marginBottom:5}}>Ready to Play?</div>
          <div style={{fontSize:13,color:'#64748b',marginBottom:22}}>Start a new round or resume one below</div>
          <button className="btn btn-primary" style={{fontSize:15,padding:'13px 30px'}} onClick={() => setShowNew(true)}>
            + New Round
          </button>
        </div>

        {inProgress.length > 0 && (
          <div className="card">
            <div className="card-title" style={{marginBottom:10}}>🔄 In Progress</div>
            {inProgress.map(r => (
              <div key={r.id} className="list-item" style={{cursor:'pointer'}} onClick={() => setActiveRoundId(r.id)}>
                <div style={{fontSize:22}}>🃏</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13}}>{r.name}</div>
                  <div style={{fontSize:11,color:'#64748b'}}>{r.hands.length} hands · {fmtDate(r.createdAt)}</div>
                </div>
                <span style={{color:'#a78bfa',fontSize:11}}>▶ Resume</span>
              </div>
            ))}
          </div>
        )}

        {showNew && <NewRoundModal players={players} onSave={startRound} onClose={() => setShowNew(false)} />}
      </div>
    );
  }

  // Active round view
  const scores = (round.type === 'single'
    ? round.participants.map(p => ({ ...p, score: calcScore(settings.points, round.hands, p.id) }))
    : round.participants.map(t => ({ ...t, score: teamScore(t, round.hands) }))
  ).sort((a, b) => b.score - a.score);
  const maxAbs = Math.max(...scores.map(s => Math.abs(s.score)), 1);

  return (
    <div className="fade-in">
      <div className="card">
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:12}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:16,color:'#c4b5fd'}}>{round.name}</div>
            <div style={{fontSize:11,color:'#64748b',marginTop:2}}>
              {round.type==='team'?'👥 Team':'👤 Individual'} · {round.hands.length} hand{round.hands.length!==1?'s':''} played
            </div>
            {round.note && <div style={{fontSize:11,color:'#94a3b8',marginTop:3,fontStyle:'italic'}}>📝 {round.note}</div>}
            <div className="status-live" style={{marginTop:5}}>
              <div style={{width:6,height:6,borderRadius:'50%',background:'#10b981',animation:'pulse 2s infinite'}}></div>
              Live
            </div>
          </div>
          <button className="btn btn-sm btn-success" onClick={finishRound}>✓ Finish Round</button>
        </div>

        <div className="section-title">Live Scores</div>
        {scores.map((p, i) => {
          const total = round.hands.length;
          const pStats = pid => ({
            wins:   total ? Math.round(round.hands.filter(h => h.placements?.first === pid).length / total * 100) : 0,
            burned: total ? Math.round(round.hands.filter(h => (h.burned||[]).includes(pid)).length / total * 100) : 0,
          });
          return (
            <div key={p.id} style={{marginBottom:8}}>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:2}}>
                <span style={{fontSize:13}}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`}</span>
                <span style={{fontSize:16}}>{round.type==='team' ? '👥' : getPlayerAvatar(p.id)}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,color:round.type==='team'?'#c4b5fd':getPlayerColor(p.id)}}>{round.type==='team' ? p.name : getPlayerName(p.id)}</div>
                  {round.type==='single' && total > 0 && (() => { const s = pStats(p.id); return (
                    <div style={{fontSize:10,color:'#64748b'}}>🥇 {s.wins}% win · 🔥 {s.burned}% burned</div>
                  ); })()}
                </div>
                <span style={{fontWeight:700,fontSize:14,color:p.score>=0?'#a78bfa':'#ef4444'}}>{p.score>=0?'+':''}{p.score}</span>
              </div>
              <div className="progress-bar" style={{marginBottom: round.type==='team'?5:0}}>
                <div className="progress-fill" style={{width:`${Math.abs(p.score)/maxAbs*100}%`,background:p.score>=0?undefined:'linear-gradient(90deg,#ef4444,#f87171)'}} />
              </div>
              {round.type==='team' && (p.playerIds||[]).map(pid => {
                const pl = players.find(x => x.id === pid);
                const ps = calcScore(settings.points, round.hands, pid);
                const s = pStats(pid);
                return (
                  <div key={pid} style={{display:'flex',alignItems:'center',gap:6,paddingLeft:22,marginTop:3}}>
                    <span style={{fontSize:14}}>{pl?.avatar||'?'}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11,color:pl?.color||'#94a3b8'}}>{pl?.name||'?'}</div>
                      {total > 0 && <div style={{fontSize:10,color:'#475569'}}>🥇 {s.wins}% · 🔥 {s.burned}%</div>}
                    </div>
                    <span style={{fontSize:11,fontWeight:600,color:ps>=0?'#a78bfa':'#ef4444'}}>{ps>=0?'+':''}{ps}</span>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      <RoundLineChart round={round} players={players} pts={settings.points} />

      <button className="btn btn-primary btn-full" style={{marginBottom:10,padding:13,fontSize:14}} onClick={() => setShowHand(true)}>
        + Add Hand #{round.hands.length + 1}
      </button>

      {round.hands.length > 0 && (
        <div className="card">
          <div className="card-title" style={{marginBottom:10}}>🃏 Hands Played</div>
          {[...round.hands].reverse().map((h, ri) => {
            const hi = round.hands.length - ri - 1;
            return (
              <div key={h.id} className="hand-row">
                <div className="hand-num">Hand #{hi+1}</div>
                <div className="hand-placements">
                  {h.placements?.first  && <span className="badge badge-gold">🥇 {getPlayerName(h.placements.first)}</span>}
                  {h.placements?.second && <span className="badge badge-silver">🥈 {getPlayerName(h.placements.second)}</span>}
                  {h.placements?.third  && <span className="badge badge-bronze">🥉 {getPlayerName(h.placements.third)}</span>}
                  {h.placements?.fourth && <span className="badge badge-4th">4️⃣ {getPlayerName(h.placements.fourth)}</span>}
                  {(h.burned||[]).map(pid=><span key={pid} className="badge badge-penalty">🔥 {getPlayerName(pid)}</span>)}
                  {(h.bonuses||[]).map(b=><span key={b.participantId} className="badge badge-bonus">🎁+{b.amount} {getPlayerName(b.participantId)}</span>)}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showHand && (
        <AddHandModal round={round} players={players} pts={settings.points} onSave={addHand} onClose={() => setShowHand(false)} />
      )}
    </div>
  );
}

// ─── DashboardTab ─────────────────────────────────────────────
function DashboardTab({ rounds, players, settings }) {
  const totalHands = rounds.reduce((s, r) => s + r.hands.length, 0);
  const active = rounds.filter(r => r.status === 'active').length;

  const playerStats = useMemo(() => players.map(player => {
    let score = 0, wins = 0, second = 0, third = 0, hands = 0, penCount = 0, bonTotal = 0;
    for (const round of rounds) {
      const inRound = round.type === 'single'
        ? round.participants.some(p => p.id === player.id)
        : round.participants.some(t => (t.playerIds||[]).includes(player.id));
      if (!inRound) continue;
      for (const h of round.hands) {
        hands++;
        if (h.placements?.first  === player.id) wins++;
        if (h.placements?.second === player.id) second++;
        if (h.placements?.third  === player.id) third++;
        score += calcScore(settings.points, [h], player.id);
        if ((h.burned||[]).includes(player.id)) penCount++;
        const bon = (h.bonuses||[]).find(b=>b.participantId===player.id);
        if (bon) bonTotal += bon.amount;
      }
    }
    return { player, score, wins, second, third, hands, penCount, bonTotal, winRate: hands ? Math.round(wins/hands*100) : 0 };
  }).sort((a,b) => b.score - a.score), [rounds, players, settings]);

  return (
    <div className="fade-in">
      <div className="stat-grid" style={{marginBottom:10}}>
        {[
          { v: rounds.length,  l: 'Rounds' },
          { v: totalHands,     l: 'Hands' },
          { v: players.length, l: 'Players' },
          { v: active,         l: 'Active', c: active ? '#10b981' : undefined },
        ].map(s => (
          <div key={s.l} className="stat-box">
            <div className="stat-value" style={s.c?{color:s.c}:{}}>{s.v}</div>
            <div className="stat-label">{s.l}</div>
          </div>
        ))}
      </div>

      {playerStats.length > 0 && (
        <div className="card">
          <div className="card-title" style={{marginBottom:10}}>🏆 Leaderboard</div>
          {playerStats.map((s, i) => (
            <div key={s.player.id} className="lb-row" style={{background:'#0d0f18',border:'1px solid #1e2235'}}>
              <div className={`lb-rank${i<3?` lb-rank-${i+1}`:''}`}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
              <div style={{fontSize:22}}>{s.player.avatar}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13,color:s.player.color||'#e2e8f0'}}>{s.player.name}</div>
                <div style={{fontSize:10,color:'#64748b'}}>{s.hands} hands · {s.winRate}% win rate</div>
              </div>
              <div className="lb-score">{s.score>=0?'+':''}{s.score}</div>
            </div>
          ))}
        </div>
      )}

      {playerStats.length > 0 && (
        <div className="card">
          <div className="card-title" style={{marginBottom:12}}>📊 Player Stats</div>
          {playerStats.map((s, i) => (
            <div key={s.player.id} style={{marginBottom:14,paddingBottom:14,borderBottom:i<playerStats.length-1?'1px solid #1e2235':'none'}}>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:8}}>
                <span style={{fontSize:20}}>{s.player.avatar}</span>
                <span style={{fontWeight:600,fontSize:13,color:s.player.color||'#e2e8f0'}}>{s.player.name}</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:5,marginBottom:s.hands?7:0}}>
                {[
                  { l:'Points',  v:s.score>=0?`+${s.score}`:s.score, c:s.score>=0?'#a78bfa':'#ef4444' },
                  { l:'1st 🥇',  v:s.wins,     c:'#f59e0b' },
                  { l:'Burned',  v:s.penCount,  c:'#ef4444' },
                  { l:'Bonus',   v:`+${s.bonTotal}`, c:'#10b981' },
                ].map(x => (
                  <div key={x.l} style={{background:'#0d0f18',borderRadius:7,padding:'7px 4px',textAlign:'center',border:'1px solid #1e2235'}}>
                    <div style={{fontSize:14,fontWeight:700,color:x.c}}>{x.v}</div>
                    <div style={{fontSize:9,color:'#64748b',marginTop:1}}>{x.l}</div>
                  </div>
                ))}
              </div>
              {s.hands > 0 && (
                <>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#64748b',marginBottom:2}}>
                    <span>Win rate</span><span>{s.winRate}%</span>
                  </div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width:`${s.winRate}%`}} />
                  </div>
                </>
              )}
            </div>
          ))}
        </div>
      )}

      {!players.length && (
        <div className="empty-state">
          <div className="empty-icon">📊</div>
          <div className="empty-text">No data yet</div>
          <div className="empty-sub">Add players in Settings and start a round</div>
        </div>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const [tab, setTab]                       = useState('ground');
  const [players, setPlayers]               = useState(() => store.get('cpt_players', []));
  const [settings, setSettings]             = useState(() => store.get('cpt_settings', DEFAULT_SETTINGS));
  const [rounds, setRounds]                 = useState(() => store.get('cpt_rounds', []));
  const [activeRoundId, setActiveRoundId]   = useState(() => store.get('cpt_active', null));

  useEffect(() => store.set('cpt_players',  players),       [players]);
  useEffect(() => store.set('cpt_settings', settings),      [settings]);
  useEffect(() => store.set('cpt_rounds',   rounds),        [rounds]);
  useEffect(() => store.set('cpt_active',   activeRoundId), [activeRoundId]);

  const activeRound = rounds.find(r => r.id === activeRoundId);

  const TABS = [
    { id: 'ground',    icon: '🎴', label: 'Play'     },
    { id: 'history',   icon: '📜', label: 'History'  },
    { id: 'dashboard', icon: '📊', label: 'Stats'    },
    { id: 'settings',  icon: '⚙️', label: 'Settings' },
  ];

  return (
    <div className="app">
      <div className="header">
        <div className="header-logo">🃏</div>
        <div>
          <div className="header-title">Card Tracker</div>
          <div className="header-sub">
            {activeRound ? `▶ ${activeRound.name}` : `${players.length} player${players.length!==1?'s':''} · ${rounds.length} round${rounds.length!==1?'s':''}`}
          </div>
        </div>
      </div>

      <div className="tab-content">
        <div style={{display: tab==='ground'    ? 'contents' : 'none'}}><PlayingGroundTab players={players} rounds={rounds} setRounds={setRounds} activeRoundId={activeRoundId} setActiveRoundId={setActiveRoundId} settings={settings} /></div>
        <div style={{display: tab==='history'   ? 'contents' : 'none'}}><HistoryTab rounds={rounds} players={players} settings={settings} /></div>
        <div style={{display: tab==='dashboard' ? 'contents' : 'none'}}><DashboardTab rounds={rounds} players={players} settings={settings} /></div>
        <div style={{display: tab==='settings'  ? 'contents' : 'none'}}><SettingsTab players={players} setPlayers={setPlayers} settings={settings} setSettings={setSettings} rounds={rounds} setRounds={setRounds} activeRoundId={activeRoundId} setActiveRoundId={setActiveRoundId} /></div>
      </div>

      <div className="bottom-nav">
        {TABS.map(t => (
          <button key={t.id} className={`nav-item${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
            <span className="nav-icon">{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
